server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # HTML nunca em cache agressivo — deploy novo precisa refletir na hora
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # assets com hash no nome (Astro/Vite) podem ficar em cache por muito tempo
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
